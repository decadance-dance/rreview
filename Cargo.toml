[workspace]

[package]
name = "rreview"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Isolated, cross-model panel review of a GitHub pull request"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
